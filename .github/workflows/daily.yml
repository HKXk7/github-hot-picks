name: Daily GitHub Hot Picks

on:
  schedule:
    # 名义上 00:00 UTC（北京时间 08:00）跑一次，生成当天推荐。
    # 但 GitHub 的定时队列会压：实测这仓库的正点那次经常拖到 05:4x UTC 才开跑，偶尔还直接不跑。
    # 所以排 4 个点做自愈：02/04/06 UTC 是重试位，只有「今天还没出过稿」才会真跑
    # （守卫在下面的「今天是否已经出过一期」里，已出过就直接跳过，几乎不花钱）。
    - cron: "0 0,2,4,6 * * *"
  # 也支持在 GitHub 网页上手动点「Run workflow」，或用 scripts/trigger-daily.mjs 从终端触发
  workflow_dispatch: {}

# 需要写权限，才能把生成的快照提交回仓库
permissions:
  contents: write

# 两个定时点 + 手动触发可能撞车：同时跑会抢同一个 dev.db 缓存，串起来更安全
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts 里 datasource.url 用 env("DATABASE_URL") 强校验，
      # 任何 prisma CLI 命令（含 generate）都要求这个变量存在，所以在 job 级统一提供，
      # 免得单个步骤漏传就挂。用绝对路径，避免 CLI 与运行时对相对路径解析不一致。
      DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --no-audit --no-fund：这两个请求会额外打 registry，网络差的时候能把
        # `npm ci` 从 40 秒拖到十几分钟（2026-11-09 的 run#28 就是 819 秒后失败）。
        # timeout-minutes：真卡住时快速失败，而不是白占一个 runner 十几分钟。
        run: npm ci --no-audit --no-fund
        timeout-minutes: 10

      - name: Generate Prisma client
        # generated/prisma 已被 .gitignore 忽略，CI checkout 后不存在，必须现生成。
        # 注意：`migrate deploy` 只建表，不会生成客户端 —— 少了这步会报
        # "Cannot find module '../generated/prisma/client'"
        run: npx prisma generate

      # ── 数据库跨运行持久化 ──────────────────────────────────────────
      # 否则每次 Actions 跑的都是全新空库：期号永远是第 1 期、
      # 往期项目不去重（会重复推荐）、教程每天重新花钱生成。
      # 做法：用 Actions 缓存存住 dev.db；任务结束时写回缓存。
      - name: Restore history database
        uses: actions/cache@v4
        with:
          path: prisma/db-cache
          key: daily-db-${{ github.run_id }}
          restore-keys: daily-db-

      - name: Prepare database
        run: |
          if [ -f prisma/db-cache/dev.db ]; then
            cp prisma/db-cache/dev.db prisma/dev.db
            echo "✅ 缓存命中：已恢复历史数据库"
          else
            echo "ℹ️ 首次运行：从空库开始，迁移后导入仓库快照"
          fi

      - name: Setup database (migrate)
        run: npx prisma migrate deploy

      - name: Bootstrap from snapshot (first run only)
        # 没有历史缓存时，把仓库里 public/data/latest.json 的上一期数据灌进库，
        # 这样期号接着走、上一期项目也进的去重名单。
        # 必须用 tsx 而不是 node：Prisma 客户端生成的是 generated/prisma/client.ts，
        # 纯 node 的 require 解析不了 .ts 后缀（本地因为一直用 tsx 跑所以不会暴露）。
        run: |
          if [ ! -f prisma/db-cache/dev.db ]; then
            npx tsx scripts/import-snapshot.ts
          fi

      - name: 今天是否已经出过一期
        # 兜底定时点跑起来时，上午那次可能已经成功了：这时整条管线没必要再跑
        # （重跑会重新生成教程、花钱，还会多提交一个只有 star 数变化的 commit）。
        # 只读 public/data/latest.json 判断，不碰数据库。
        id: today
        run: |
          node -e '
            const fs = require("node:fs");
            const today = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Shanghai" }).format(new Date());
            let have = "";
            try {
              have = JSON.parse(fs.readFileSync("public/data/latest.json", "utf8")).dateKey || "";
            } catch {}
            const needed = have === today ? "false" : "true";
            console.log(`北京时间今天 ${today}，仓库里最新一期 ${have || "（无）"}，需要跑=${needed}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          '

      - name: Run daily update (fetch → filter → generate)
        # 用 != 'false' 而不是 == 'true'：守卫步骤自己出错时（node 异常、输出没写进去）
        # 宁可照常跑一遍，也不要静默跳过、把「今天没更新」变成一件无声的事。
        if: steps.today.outputs.needed != 'false'
        run: npm run update:daily
        env:
          # 用 GitHub 自带 token 提高 API 限流额度
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DATABASE_URL 已在 job 级统一设置
          # 硅基流动密钥：用于给每个项目自动生成小白教程
          # 需要在仓库 Settings → Secrets and variables → Actions 里添加 SILICONFLOW_API_KEY
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
          # 订阅源里要写绝对链接，没配就退回 localhost（在 Settings → Variables 里加）
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Purge expired chat sessions
        # 会话里是用户真实问过的话，不该无限期留着
        run: npm run cleanup:sessions

      - name: Cost report
        # 把今天这次生成花了多少 token 打进日志，成本异常时能第一时间看见
        run: npm run usage -- --days 1

      - name: Save database to cache
        # 先 checkpoint 把 WAL 里的数据落盘，再整库写回缓存目录（cache@v4 在任务结束时自动保存）
        run: |
          sqlite3 prisma/dev.db "PRAGMA wal_checkpoint(TRUNCATE);"
          mkdir -p prisma/db-cache
          cp prisma/dev.db prisma/db-cache/dev.db

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交生成的产物：快照（站点前端的数据库兜底）+ 订阅源（静态 RSS）
          # 整个数据包一起提交：latest.json / feed.xml / history.json / issues/*.json
          git add public/data public/feed.xml
          if git diff --cached --quiet; then
            echo "没有内容变化，跳过提交"
          else
            git commit -m "chore: daily recommendation $(date +%F)"
            git push
          fi
