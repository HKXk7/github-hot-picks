name: Daily GitHub Hot Picks

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动跑一次，生成当天推荐
    - cron: "0 0 * * *"
  # 也支持在 GitHub 网页上手动点「Run workflow」
  workflow_dispatch: {}

# 需要写权限，才能把生成的快照提交回仓库
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts 里 datasource.url 用 env("DATABASE_URL") 强校验，
      # 任何 prisma CLI 命令（含 generate）都要求这个变量存在，所以在 job 级统一提供，
      # 免得单个步骤漏传就挂。用绝对路径，避免 CLI 与运行时对相对路径解析不一致。
      DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # generated/prisma 已被 .gitignore 忽略，CI checkout 后不存在，必须现生成。
        # 注意：`migrate deploy` 只建表，不会生成客户端 —— 少了这步会报
        # "Cannot find module '../generated/prisma/client'"
        run: npx prisma generate

      # ── 数据库跨运行持久化 ──────────────────────────────────────────
      # 否则每次 Actions 跑的都是全新空库：期号永远是第 1 期、
      # 往期项目不去重（会重复推荐）、教程每天重新花钱生成。
      # 做法：用 Actions 缓存存住 dev.db；任务结束时写回缓存。
      - name: Restore history database
        uses: actions/cache@v4
        with:
          path: prisma/db-cache
          key: daily-db-${{ github.run_id }}
          restore-keys: daily-db-

      - name: Prepare database
        run: |
          if [ -f prisma/db-cache/dev.db ]; then
            cp prisma/db-cache/dev.db prisma/dev.db
            echo "✅ 缓存命中：已恢复历史数据库"
          else
            echo "ℹ️ 首次运行：从空库开始，迁移后导入仓库快照"
          fi

      - name: Setup database (migrate)
        run: npx prisma migrate deploy

      - name: Bootstrap from snapshot (first run only)
        # 没有历史缓存时，把仓库里 public/data/latest.json 的上一期数据灌进库，
        # 这样期号接着走、上一期项目也进的去重名单。
        run: |
          if [ ! -f prisma/db-cache/dev.db ]; then
            node scripts/import-snapshot.js
          fi

      - name: Run daily update (fetch → filter → generate)
        run: npm run update:daily
        env:
          # 用 GitHub 自带 token 提高 API 限流额度
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DATABASE_URL 已在 job 级统一设置
          # 硅基流动密钥：用于给每个项目自动生成小白教程
          # 需要在仓库 Settings → Secrets and variables → Actions 里添加 SILICONFLOW_API_KEY
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1

      - name: Save database to cache
        # 先 checkpoint 把 WAL 里的数据落盘，再整库写回缓存目录（cache@v4 在任务结束时自动保存）
        run: |
          sqlite3 prisma/dev.db "PRAGMA wal_checkpoint(TRUNCATE);"
          mkdir -p prisma/db-cache
          cp prisma/dev.db prisma/db-cache/dev.db

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交生成的快照文件（站点前端通过它读取最新推荐）
          git add public/data/latest.json
          if git diff --cached --quiet; then
            echo "没有内容变化，跳过提交"
          else
            git commit -m "chore: daily recommendation $(date +%F)"
            git push
          fi
