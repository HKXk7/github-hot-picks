name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts 对 DATABASE_URL 是硬校验，任何 prisma CLI 都要求它在位
      DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # generated/prisma 不在仓库里，typecheck 之前必须先生成
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        # 覆盖 schema 跨字段约束、命令真实性解析器、BM25 与 RRF。
        # 这几处都是纯函数，回归了不会有任何现象，只能靠测试兜住。
        run: npm test

      - name: Lint
        run: npm run lint
