name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts 对 DATABASE_URL 是硬校验，任何 prisma CLI 都要求它在位
      DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # generated/prisma 不在仓库里，typecheck 之前必须先生成
        run: npx prisma generate

      - name: Generate Next route types
        # LayoutProps / PageProps 这类类型是 Next 生成的（.next/types），仓库里没有。
        # 本地因为有 .next 目录才检查得过，CI 全新 checkout 会直接报
        # "Cannot find name 'LayoutProps'"。next typegen 只生成类型，不用整编一遍。
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        # 覆盖 schema 跨字段约束、命令真实性解析器、BM25 与 RRF。
        # 这几处都是纯函数，回归了不会有任何现象，只能靠测试兜住。
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        # typecheck 只证明「代码写得对」，不证明「能上线」。
        # 开了 cacheComponents 之后，预渲染期的坑（Date.now()、Suspense 外的
        # params / 数据库访问）只在 build 时才报错——这两个问题就因为 CI 从不
        # build 而藏了很久。放在最后一步：它最慢，前面的检查先给出反馈。
        run: npm run build
